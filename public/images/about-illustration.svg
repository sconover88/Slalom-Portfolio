<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" fill="none">
  <!-- Background circle -->
  <circle cx="200" cy="200" r="180" fill="#F1F5F9" />
  
  <!-- Monitor/screen -->
  <rect x="100" y="80" width="200" height="150" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="4"/>
  <!-- Screen content -->
  <rect x="120" y="100" width="70" height="10" rx="4" fill="#8B5CF6"/>
  <rect x="120" y="120" width="160" height="6" rx="3" fill="#E2E8F0"/>
  <rect x="120" y="134" width="140" height="6" rx="3" fill="#E2E8F0"/>
  <rect x="120" y="148" width="100" height="6" rx="3" fill="#E2E8F0"/>
  <!-- Color swatches on screen -->
  <circle cx="130" cy="180" r="10" fill="#8B5CF6"/>
  <circle cx="158" cy="180" r="10" fill="#F472B6"/>
  <circle cx="186" cy="180" r="10" fill="#F9A825"/>
  <circle cx="214" cy="180" r="10" fill="#34D399"/>
  <!-- Screen stand -->
  <rect x="175" y="230" width="50" height="12" rx="2" fill="#1E293B"/>
  <rect x="155" y="242" width="90" height="8" rx="4" fill="#1E293B"/>
  
  <!-- Cursor -->
  <path d="M270 140 L270 175 L282 165 L295 185 L302 181 L289 161 L305 158 Z" fill="#8B5CF6" stroke="#1E293B" stroke-width="2.5"/>
  
  <!-- Sparkles / AI stars -->
  <g fill="#F9A825">
    <path d="M320 90 L324 100 L334 104 L324 108 L320 118 L316 108 L306 104 L316 100 Z"/>
    <path d="M80 130 L83 137 L90 140 L83 143 L80 150 L77 143 L70 140 L77 137 Z" transform="scale(0.7) translate(40, 60)"/>
    <path d="M340 180 L343 187 L350 190 L343 193 L340 200 L337 193 L330 190 L337 187 Z" transform="scale(0.6) translate(220, 100)"/>
  </g>
  
  <!-- Floating shapes — Playful Geometric -->
  <!-- Pink triangle -->
  <polygon points="70,80 90,50 110,80" fill="#F472B6" opacity="0.7"/>
  <!-- Yellow circle -->
  <circle cx="340" cy="260" r="22" fill="#F9A825" opacity="0.6"/>
  <!-- Emerald square rotated -->
  <rect x="55" y="250" width="30" height="30" rx="4" fill="#34D399" opacity="0.6" transform="rotate(15, 70, 265)"/>
  <!-- Violet circle outline -->
  <circle cx="330" cy="70" r="18" fill="none" stroke="#8B5CF6" stroke-width="3" opacity="0.5"/>
  
  <!-- Pen tool -->
  <g transform="translate(60, 170) rotate(-30, 20, 40)">
    <rect x="14" y="0" width="12" height="50" rx="2" fill="#F472B6" stroke="#1E293B" stroke-width="2"/>
    <polygon points="14,50 26,50 20,65" fill="#1E293B"/>
    <rect x="14" y="0" width="12" height="10" rx="2" fill="#1E293B"/>
  </g>
  
  <!-- Figma-like component dots -->
  <circle cx="85" cy="310" r="6" fill="#8B5CF6"/>
  <circle cx="105" cy="310" r="6" fill="#F472B6"/>
  <circle cx="95" cy="295" r="6" fill="#34D399"/>
  <line x1="85" y1="310" x2="95" y2="295" stroke="#1E293B" stroke-width="1.5"/>
  <line x1="105" y1="310" x2="95" y2="295" stroke="#1E293B" stroke-width="1.5"/>
  <line x1="85" y1="310" x2="105" y2="310" stroke="#1E293B" stroke-width="1.5"/>
  
  <!-- Squiggly line -->
  <path d="M140 330 Q160 310 180 330 T220 330 T260 330" fill="none" stroke="#F9A825" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Small dots pattern -->
  <circle cx="300" cy="310" r="2" fill="#E2E8F0"/>
  <circle cx="315" cy="310" r="2" fill="#E2E8F0"/>
  <circle cx="330" cy="310" r="2" fill="#E2E8F0"/>
  <circle cx="300" cy="325" r="2" fill="#E2E8F0"/>
  <circle cx="315" cy="325" r="2" fill="#E2E8F0"/>
  <circle cx="330" cy="325" r="2" fill="#E2E8F0"/>
  <circle cx="300" cy="340" r="2" fill="#E2E8F0"/>
  <circle cx="315" cy="340" r="2" fill="#E2E8F0"/>
  <circle cx="330" cy="340" r="2" fill="#E2E8F0"/>
</svg>
