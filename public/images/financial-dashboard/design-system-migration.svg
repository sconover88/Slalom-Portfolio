<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <!-- Background -->
  <rect width="1200" height="400" fill="#F8FAFC" rx="12"/>
  <!-- Subtle decorative gradient fill -->
  <rect x="0" y="0" width="1200" height="400" fill="#4F46E5" opacity="0.015" rx="12"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0F172A">Design System Migration</text>
  <text x="600" y="58" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="11" fill="#64748B">300+ components transitioned to a scalable foundation</text>

  <!-- FROM: Material Design -->
  <rect x="40" y="80" width="420" height="280" fill="#FFFFFF" rx="12" stroke="#E2E8F0" stroke-width="1"/>
  <text x="250" y="108" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Material Design</text>
  <text x="250" y="124" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" fill="#64748B">Previous component library</text>
  
  <!-- Material Design component examples -->
  <rect x="60" y="140" width="180" height="36" rx="8" fill="#E3F2FD" stroke="#1976D2" stroke-width="1"/>
  <rect x="70" y="150" width="100" height="16" rx="4" fill="#1976D2"/>
  <text x="120" y="162" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="white">Button</text>

  <rect x="250" y="140" width="180" height="36" rx="8" fill="#E3F2FD" stroke="#1976D2" stroke-width="1"/>
  <rect x="260" y="150" width="160" height="16" rx="8" fill="#FFFFFF" stroke="#1976D2" stroke-width="1"/>
  <text x="340" y="162" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="8" fill="#1976D2">Text Input</text>

  <rect x="60" y="190" width="120" height="36" rx="8" fill="#E3F2FD" stroke="#1976D2" stroke-width="1"/>
  <circle cx="80" cy="208" r="8" fill="#1976D2"/>
  <circle cx="80" cy="208" r="4" fill="white"/>
  <text x="95" y="212" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="8" fill="#1976D2">Radio</text>

  <rect x="190" y="190" width="120" height="36" rx="8" fill="#E3F2FD" stroke="#1976D2" stroke-width="1"/>
  <rect x="200" y="202" width="16" height="16" rx="2" fill="#1976D2"/>
  <text x="222" y="214" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="8" fill="#1976D2">Checkbox</text>

  <rect x="320" y="190" width="120" height="36" rx="8" fill="#E3F2FD" stroke="#1976D2" stroke-width="1"/>
  <rect x="330" y="202" width="30" height="14" rx="7" fill="#1976D2"/>
  <text x="370" y="213" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="8" fill="#1976D2">Toggle</text>

  <!-- More components indicator -->
  <rect x="60" y="240" width="380" height="30" rx="8" fill="#F1F5F9"/>
  <text x="250" y="259" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#64748B">+ cards, dialogs, tables, navigation, forms...</text>

  <!-- Issues -->
  <rect x="60" y="285" width="380" height="55" rx="8" fill="#FEF2F2"/>
  <circle cx="82" cy="312" r="10" fill="#EF4444"/>
  <text x="77" y="316" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" fill="white" font-weight="bold">!</text>
  <text x="100" y="305" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" font-weight="600" fill="#0F172A">Challenges</text>
  <text x="100" y="320" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#64748B">Not aligned with Salesforce platform &#x2022; Rework risk</text>
  <text x="100" y="333" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#64748B">Inconsistent implementation &#x2022; Scaling issues</text>

  <!-- Arrow -->
  <path d="M470,210 L530,210" fill="none" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
  <polygon points="530,204 548,210 530,216" fill="#0F172A"/>
  <text x="509" y="195" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" font-weight="700" fill="#0F172A">300+</text>
  <text x="509" y="230" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#64748B">migrated</text>

  <!-- TO: Salesforce Lightning -->
  <rect x="560" y="80" width="600" height="280" fill="#FFFFFF" rx="12" stroke="#10B981" stroke-width="1.5"/>
  <text x="860" y="108" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Salesforce Lightning Design System</text>
  <text x="860" y="124" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" fill="#64748B">New scalable foundation</text>

  <!-- Lightning component examples -->
  <rect x="580" y="140" width="160" height="36" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1"/>
  <rect x="590" y="150" width="90" height="16" rx="4" fill="#10B981"/>
  <text x="635" y="162" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="white">Button</text>

  <rect x="750" y="140" width="160" height="36" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1"/>
  <rect x="760" y="150" width="140" height="16" rx="4" fill="#FFFFFF" stroke="#10B981" stroke-width="1"/>
  <text x="830" y="162" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="8" fill="#10B981">Input Field</text>

  <rect x="920" y="140" width="160" height="36" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1"/>
  <rect x="930" y="150" width="140" height="16" rx="4" fill="#FFFFFF" stroke="#10B981" stroke-width="1"/>
  <text x="1000" y="162" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="8" fill="#10B981">Dropdown</text>

  <rect x="580" y="190" width="110" height="36" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1"/>
  <text x="635" y="212" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="8" fill="#10B981">Card</text>

  <rect x="700" y="190" width="110" height="36" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1"/>
  <text x="755" y="212" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="8" fill="#10B981">Modal</text>

  <rect x="820" y="190" width="110" height="36" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1"/>
  <text x="875" y="212" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="8" fill="#10B981">Data Table</text>

  <rect x="940" y="190" width="110" height="36" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1"/>
  <text x="995" y="212" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="8" fill="#10B981">Navigation</text>

  <!-- More components -->
  <rect x="580" y="240" width="560" height="30" rx="8" fill="#F0FDF4"/>
  <text x="860" y="259" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#64748B">+ alerts, tabs, accordions, progress, avatars, badges...</text>

  <!-- Benefits -->
  <rect x="580" y="285" width="560" height="55" rx="8" fill="#ECFDF5"/>
  <circle cx="602" cy="312" r="10" fill="#10B981"/>
  <path d="M597,312 L600,315 L607,308" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="620" y="305" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" font-weight="600" fill="#0F172A">Benefits</text>
  <text x="620" y="320" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#64748B">Platform-aligned &#x2022; Scalable &#x2022; No rework needed</text>
  <text x="620" y="333" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#64748B">Consistent implementation &#x2022; Developer-ready</text>
</svg>
