<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <!-- Background -->
  <rect width="1200" height="400" fill="#FFFDF5" rx="16"/>
  
  <!-- Decorative -->
  <circle cx="1140" cy="50" r="20" fill="#8B5CF6" opacity="0.08"/>
  <circle cx="60" cy="350" r="25" fill="#FBBF24" opacity="0.08"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-family="Outfit, system-ui, sans-serif" font-size="18" font-weight="800" fill="#1E293B">Design System Migration</text>
  <text x="600" y="58" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui" font-size="11" fill="#64748B">300+ components transitioned to a scalable foundation</text>

  <!-- FROM: Material Design -->
  <rect x="40" y="80" width="420" height="280" fill="#FFFFFF" rx="16" stroke="#1E293B" stroke-width="2"/>
  <text x="250" y="108" text-anchor="middle" font-family="Outfit, system-ui" font-size="13" font-weight="700" fill="#1E293B">Material Design</text>
  <text x="250" y="124" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui" font-size="10" fill="#64748B">Previous component library</text>
  
  <!-- Material Design component examples -->
  <rect x="60" y="140" width="180" height="36" rx="4" fill="#E3F2FD" stroke="#1976D2" stroke-width="1.5"/>
  <rect x="70" y="150" width="100" height="16" rx="2" fill="#1976D2"/>
  <text x="120" y="162" text-anchor="middle" font-family="system-ui" font-size="9" fill="white">Button</text>

  <rect x="250" y="140" width="180" height="36" rx="4" fill="#E3F2FD" stroke="#1976D2" stroke-width="1.5"/>
  <rect x="260" y="150" width="160" height="16" rx="8" fill="#FFFFFF" stroke="#1976D2" stroke-width="1"/>
  <text x="340" y="162" text-anchor="middle" font-family="system-ui" font-size="8" fill="#1976D2">Text Input</text>

  <rect x="60" y="190" width="120" height="36" rx="4" fill="#E3F2FD" stroke="#1976D2" stroke-width="1.5"/>
  <circle cx="80" cy="208" r="8" fill="#1976D2"/>
  <circle cx="80" cy="208" r="4" fill="white"/>
  <text x="95" y="212" font-family="system-ui" font-size="8" fill="#1976D2">Radio</text>

  <rect x="190" y="190" width="120" height="36" rx="4" fill="#E3F2FD" stroke="#1976D2" stroke-width="1.5"/>
  <rect x="200" y="202" width="16" height="16" rx="2" fill="#1976D2"/>
  <text x="222" y="214" font-family="system-ui" font-size="8" fill="#1976D2">Checkbox</text>

  <rect x="320" y="190" width="120" height="36" rx="4" fill="#E3F2FD" stroke="#1976D2" stroke-width="1.5"/>
  <rect x="330" y="202" width="30" height="14" rx="7" fill="#1976D2"/>
  <text x="370" y="213" font-family="system-ui" font-size="8" fill="#1976D2">Toggle</text>

  <!-- More components indicator -->
  <rect x="60" y="240" width="380" height="30" rx="6" fill="#F5F5F5"/>
  <text x="250" y="259" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui" font-size="9" fill="#64748B">+ cards, dialogs, tables, navigation, forms...</text>

  <!-- Issues -->
  <rect x="60" y="285" width="380" height="55" rx="10" fill="#FEF2F2"/>
  <circle cx="82" cy="312" r="10" fill="#EF4444"/>
  <text x="77" y="316" font-family="system-ui" font-size="10" fill="white" font-weight="bold">!</text>
  <text x="100" y="305" font-family="Plus Jakarta Sans, system-ui" font-size="9" font-weight="600" fill="#1E293B">Challenges</text>
  <text x="100" y="320" font-family="Plus Jakarta Sans, system-ui" font-size="9" fill="#64748B">Not aligned with Salesforce platform &#x2022; Rework risk</text>
  <text x="100" y="333" font-family="Plus Jakarta Sans, system-ui" font-size="9" fill="#64748B">Inconsistent implementation &#x2022; Scaling issues</text>

  <!-- Arrow -->
  <path d="M470,210 L530,210" fill="none" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>
  <polygon points="530,204 548,210 530,216" fill="#1E293B"/>
  <text x="509" y="195" text-anchor="middle" font-family="Outfit, system-ui" font-size="10" font-weight="700" fill="#1E293B">300+</text>
  <text x="509" y="230" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui" font-size="9" fill="#64748B">migrated</text>

  <!-- TO: Salesforce Lightning -->
  <rect x="560" y="80" width="600" height="280" fill="#FFFFFF" rx="16" stroke="#34D399" stroke-width="2.5"/>
  <text x="860" y="108" text-anchor="middle" font-family="Outfit, system-ui" font-size="13" font-weight="700" fill="#1E293B">Salesforce Lightning Design System</text>
  <text x="860" y="124" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui" font-size="10" fill="#64748B">New scalable foundation</text>

  <!-- Lightning component examples -->
  <rect x="580" y="140" width="160" height="36" rx="6" fill="#E8F5E9" stroke="#0B8043" stroke-width="1.5"/>
  <rect x="590" y="150" width="90" height="16" rx="4" fill="#0B8043"/>
  <text x="635" y="162" text-anchor="middle" font-family="system-ui" font-size="9" fill="white">Button</text>

  <rect x="750" y="140" width="160" height="36" rx="6" fill="#E8F5E9" stroke="#0B8043" stroke-width="1.5"/>
  <rect x="760" y="150" width="140" height="16" rx="4" fill="#FFFFFF" stroke="#0B8043" stroke-width="1"/>
  <text x="830" y="162" text-anchor="middle" font-family="system-ui" font-size="8" fill="#0B8043">Input Field</text>

  <rect x="920" y="140" width="160" height="36" rx="6" fill="#E8F5E9" stroke="#0B8043" stroke-width="1.5"/>
  <rect x="930" y="150" width="140" height="16" rx="4" fill="#FFFFFF" stroke="#0B8043" stroke-width="1"/>
  <text x="1000" y="162" text-anchor="middle" font-family="system-ui" font-size="8" fill="#0B8043">Dropdown</text>

  <rect x="580" y="190" width="110" height="36" rx="6" fill="#E8F5E9" stroke="#0B8043" stroke-width="1.5"/>
  <text x="635" y="212" text-anchor="middle" font-family="system-ui" font-size="8" fill="#0B8043">Card</text>

  <rect x="700" y="190" width="110" height="36" rx="6" fill="#E8F5E9" stroke="#0B8043" stroke-width="1.5"/>
  <text x="755" y="212" text-anchor="middle" font-family="system-ui" font-size="8" fill="#0B8043">Modal</text>

  <rect x="820" y="190" width="110" height="36" rx="6" fill="#E8F5E9" stroke="#0B8043" stroke-width="1.5"/>
  <text x="875" y="212" text-anchor="middle" font-family="system-ui" font-size="8" fill="#0B8043">Data Table</text>

  <rect x="940" y="190" width="110" height="36" rx="6" fill="#E8F5E9" stroke="#0B8043" stroke-width="1.5"/>
  <text x="995" y="212" text-anchor="middle" font-family="system-ui" font-size="8" fill="#0B8043">Navigation</text>

  <!-- More components -->
  <rect x="580" y="240" width="560" height="30" rx="6" fill="#F1F8E9"/>
  <text x="860" y="259" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui" font-size="9" fill="#64748B">+ alerts, tabs, accordions, progress, avatars, badges...</text>

  <!-- Benefits -->
  <rect x="580" y="285" width="560" height="55" rx="10" fill="#ECFDF5"/>
  <circle cx="602" cy="312" r="10" fill="#34D399"/>
  <path d="M597,312 L600,315 L607,308" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="620" y="305" font-family="Plus Jakarta Sans, system-ui" font-size="9" font-weight="600" fill="#1E293B">Benefits</text>
  <text x="620" y="320" font-family="Plus Jakarta Sans, system-ui" font-size="9" fill="#64748B">Platform-aligned &#x2022; Scalable &#x2022; No rework needed</text>
  <text x="620" y="333" font-family="Plus Jakarta Sans, system-ui" font-size="9" fill="#64748B">Consistent implementation &#x2022; Developer-ready</text>
</svg>
