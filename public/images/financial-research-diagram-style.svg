<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <!-- Background -->
  <rect width="1200" height="600" fill="#FFFDF5" rx="16"/>
  
  <!-- Decorative -->
  <circle cx="1140" cy="60" r="25" fill="#34D399" opacity="0.1"/>
  <circle cx="60" cy="540" r="20" fill="#F472B6" opacity="0.1"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-family="Outfit, system-ui, sans-serif" font-size="18" font-weight="800" fill="#1E293B">Research Synthesis</text>
  <text x="600" y="60" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui" font-size="11" fill="#64748B">15 interviews &#x2192; 4 strategic themes &#x2192; Platform vision</text>

  <!-- Center hub: 3 Personas -->
  <circle cx="600" cy="300" r="80" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="2"/>
  <text x="600" y="280" text-anchor="middle" font-family="Outfit, system-ui" font-size="11" font-weight="700" fill="#1E293B">3 Personas</text>
  <!-- Persona pills inside hub -->
  <rect x="550" y="290" width="100" height="18" rx="9" fill="#8B5CF6"/>
  <text x="600" y="303" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui" font-size="8" font-weight="600" fill="white">Clients</text>
  <rect x="540" y="314" width="55" height="18" rx="9" fill="#34D399"/>
  <text x="567" y="327" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui" font-size="8" font-weight="600" fill="#1E293B">Advisors</text>
  <rect x="602" y="314" width="65" height="18" rx="9" fill="#FBBF24"/>
  <text x="634" y="327" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui" font-size="8" font-weight="600" fill="#1E293B">Home Office</text>

  <!-- Theme 1: Top-left — Collaboration -->
  <rect x="60" y="80" width="320" height="160" fill="#FFFFFF" rx="14" stroke="#8B5CF6" stroke-width="2"/>
  <circle cx="90" cy="110" r="14" fill="#8B5CF6"/>
  <text x="84" y="114" font-family="system-ui" font-size="12" fill="white" font-weight="bold">1</text>
  <text x="112" y="108" font-family="Outfit, system-ui" font-size="13" font-weight="700" fill="#1E293B">Ease of Collaboration</text>
  <text x="112" y="124" font-family="Plus Jakarta Sans, system-ui" font-size="10" fill="#64748B">Breaking down silos between all parties</text>
  <line x1="80" y1="140" x2="360" y2="140" stroke="#E2E8F0" stroke-width="1"/>
  <circle cx="82" cy="158" r="2.5" fill="#8B5CF6"/>
  <text x="92" y="162" font-family="Plus Jakarta Sans, system-ui" font-size="9" fill="#1E293B">Single source of truth</text>
  <circle cx="82" cy="176" r="2.5" fill="#8B5CF6"/>
  <text x="92" y="180" font-family="Plus Jakarta Sans, system-ui" font-size="9" fill="#1E293B">Shared workspaces &amp; seamless handoffs</text>
  <circle cx="82" cy="194" r="2.5" fill="#8B5CF6"/>
  <text x="92" y="198" font-family="Plus Jakarta Sans, system-ui" font-size="9" fill="#1E293B">Real-time notifications &amp; chat</text>
  <rect x="80" y="210" width="140" height="18" rx="9" fill="#F5F3FF"/>
  <text x="150" y="222" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui" font-size="8" fill="#8B5CF6">&#x2192; Faster onboarding</text>
  <!-- Connector to center -->
  <path d="M380,180 Q480,220 520,270" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="4,4" opacity="0.4"/>

  <!-- Theme 2: Top-right — Automation -->
  <rect x="820" y="80" width="320" height="160" fill="#FFFFFF" rx="14" stroke="#34D399" stroke-width="2"/>
  <circle cx="850" cy="110" r="14" fill="#34D399"/>
  <text x="844" y="114" font-family="system-ui" font-size="12" fill="white" font-weight="bold">2</text>
  <text x="872" y="108" font-family="Outfit, system-ui" font-size="13" font-weight="700" fill="#1E293B">Intelligent Automation</text>
  <text x="872" y="124" font-family="Plus Jakarta Sans, system-ui" font-size="10" fill="#64748B">Reducing manual effort across all roles</text>
  <line x1="840" y1="140" x2="1120" y2="140" stroke="#E2E8F0" stroke-width="1"/>
  <circle cx="842" cy="158" r="2.5" fill="#34D399"/>
  <text x="852" y="162" font-family="Plus Jakarta Sans, system-ui" font-size="9" fill="#1E293B">Auto-fill, e-signatures, error checking</text>
  <circle cx="842" cy="176" r="2.5" fill="#34D399"/>
  <text x="852" y="180" font-family="Plus Jakarta Sans, system-ui" font-size="9" fill="#1E293B">Triggered alerts &amp; self-service</text>
  <circle cx="842" cy="194" r="2.5" fill="#34D399"/>
  <text x="852" y="198" font-family="Plus Jakarta Sans, system-ui" font-size="9" fill="#1E293B">Automated compliance monitoring</text>
  <rect x="840" y="210" width="160" height="18" rx="9" fill="#ECFDF5"/>
  <text x="920" y="222" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui" font-size="8" fill="#059669">&#x2192; Focus on high-value work</text>
  <!-- Connector to center -->
  <path d="M820,180 Q720,220 680,270" fill="none" stroke="#34D399" stroke-width="2" stroke-dasharray="4,4" opacity="0.4"/>

  <!-- Theme 3: Bottom-left — Personalized Guidance -->
  <rect x="60" y="370" width="320" height="160" fill="#FFFFFF" rx="14" stroke="#FBBF24" stroke-width="2"/>
  <circle cx="90" cy="400" r="14" fill="#FBBF24"/>
  <text x="84" y="404" font-family="system-ui" font-size="12" fill="#1E293B" font-weight="bold">3</text>
  <text x="112" y="398" font-family="Outfit, system-ui" font-size="13" font-weight="700" fill="#1E293B">Personalized Guidance</text>
  <text x="112" y="414" font-family="Plus Jakarta Sans, system-ui" font-size="10" fill="#64748B">Every client feels understood &amp; supported</text>
  <line x1="80" y1="430" x2="360" y2="430" stroke="#E2E8F0" stroke-width="1"/>
  <circle cx="82" cy="448" r="2.5" fill="#FBBF24"/>
  <text x="92" y="452" font-family="Plus Jakarta Sans, system-ui" font-size="9" fill="#1E293B">Data-driven personalization</text>
  <circle cx="82" cy="466" r="2.5" fill="#FBBF24"/>
  <text x="92" y="470" font-family="Plus Jakarta Sans, system-ui" font-size="9" fill="#1E293B">AI-driven advisor recommendations</text>
  <circle cx="82" cy="484" r="2.5" fill="#FBBF24"/>
  <text x="92" y="488" font-family="Plus Jakarta Sans, system-ui" font-size="9" fill="#1E293B">Proactive intervention dashboards</text>
  <rect x="80" y="500" width="160" height="18" rx="9" fill="#FFFBEB"/>
  <text x="160" y="512" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui" font-size="8" fill="#D97706">&#x2192; Stronger engagement</text>
  <!-- Connector to center -->
  <path d="M380,430 Q480,380 520,330" fill="none" stroke="#FBBF24" stroke-width="2" stroke-dasharray="4,4" opacity="0.4"/>

  <!-- Theme 4: Bottom-right — Transparent Data -->
  <rect x="820" y="370" width="320" height="160" fill="#FFFFFF" rx="14" stroke="#F472B6" stroke-width="2"/>
  <circle cx="850" cy="400" r="14" fill="#F472B6"/>
  <text x="844" y="404" font-family="system-ui" font-size="12" fill="white" font-weight="bold">4</text>
  <text x="872" y="398" font-family="Outfit, system-ui" font-size="13" font-weight="700" fill="#1E293B">Transparent Data</text>
  <text x="872" y="414" font-family="Plus Jakarta Sans, system-ui" font-size="10" fill="#64748B">Confident decisions backed by accuracy</text>
  <line x1="840" y1="430" x2="1120" y2="430" stroke="#E2E8F0" stroke-width="1"/>
  <circle cx="842" cy="448" r="2.5" fill="#F472B6"/>
  <text x="852" y="452" font-family="Plus Jakarta Sans, system-ui" font-size="9" fill="#1E293B">Integrated data layer for all UIs</text>
  <circle cx="842" cy="466" r="2.5" fill="#F472B6"/>
  <text x="852" y="470" font-family="Plus Jakarta Sans, system-ui" font-size="9" fill="#1E293B">Persona-specific dashboards</text>
  <circle cx="842" cy="484" r="2.5" fill="#F472B6"/>
  <text x="852" y="488" font-family="Plus Jakarta Sans, system-ui" font-size="9" fill="#1E293B">Real-time synced &amp; visualized data</text>
  <rect x="840" y="500" width="140" height="18" rx="9" fill="#FDF2F8"/>
  <text x="910" y="512" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui" font-size="8" fill="#DB2777">&#x2192; Reduced risk</text>
  <!-- Connector to center -->
  <path d="M820,430 Q720,380 680,330" fill="none" stroke="#F472B6" stroke-width="2" stroke-dasharray="4,4" opacity="0.4"/>
</svg>
