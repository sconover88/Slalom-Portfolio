<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <!-- Light background -->
  <rect width="1200" height="800" fill="#F1F5F9" rx="24"/>
  
  <!-- Large left card -->
  <rect x="30" y="30" width="460" height="740" rx="20" fill="#8B5CF6"/>
  <rect x="50" y="50" width="420" height="700" rx="14" fill="#F1F5F9"/>

  <!-- Top-right wide card -->
  <rect x="510" y="30" width="450" height="360" rx="20" fill="#1E293B"/>
  <rect x="526" y="46" width="418" height="328" rx="12" fill="#F1F5F9"/>

  <!-- Top-right small card -->
  <rect x="980" y="30" width="190" height="170" rx="20" fill="#34D399"/>
  <rect x="996" y="46" width="158" height="138" rx="12" fill="#F1F5F9"/>

  <!-- Middle-right small card -->
  <rect x="980" y="220" width="190" height="170" rx="20" fill="#F472B6"/>
  <rect x="996" y="236" width="158" height="138" rx="12" fill="#F1F5F9"/>

  <!-- Bottom-left of right section -->
  <rect x="510" y="410" width="220" height="360" rx="20" fill="#FBBF24"/>
  <rect x="526" y="426" width="188" height="328" rx="12" fill="#F1F5F9"/>

  <!-- Bottom-middle card -->
  <rect x="750" y="410" width="210" height="360" rx="20" fill="#1E293B"/>
  <rect x="766" y="426" width="178" height="328" rx="12" fill="#F1F5F9"/>

  <!-- Bottom-right card -->
  <rect x="980" y="410" width="190" height="360" rx="20" fill="#8B5CF6" opacity="0.6"/>
  <rect x="996" y="426" width="158" height="328" rx="12" fill="#F1F5F9"/>
</svg>
