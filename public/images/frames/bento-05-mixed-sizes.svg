<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <!-- Soft violet background -->
  <rect width="1200" height="800" fill="#EDE9FE" rx="24"/>
  
  <!-- Top-left small square -->
  <rect x="30" y="30" width="240" height="240" rx="20" fill="#8B5CF6"/>
  <rect x="46" y="46" width="208" height="208" rx="14" fill="#F8FAFC"/>

  <!-- Top-center wide -->
  <rect x="290" y="30" width="520" height="240" rx="20" fill="#1E293B"/>
  <rect x="306" y="46" width="488" height="208" rx="14" fill="#F8FAFC"/>

  <!-- Top-right medium -->
  <rect x="830" y="30" width="340" height="240" rx="20" fill="#F472B6"/>
  <rect x="846" y="46" width="308" height="208" rx="14" fill="#F8FAFC"/>

  <!-- Middle-left wide -->
  <rect x="30" y="290" width="400" height="260" rx="20" fill="#FBBF24"/>
  <rect x="46" y="306" width="368" height="228" rx="14" fill="#F8FAFC"/>

  <!-- Middle-center tall -->
  <rect x="450" y="290" width="300" height="480" rx="20" fill="#34D399"/>
  <rect x="466" y="306" width="268" height="448" rx="14" fill="#F8FAFC"/>

  <!-- Middle-right -->
  <rect x="770" y="290" width="400" height="260" rx="20" fill="#1E293B"/>
  <rect x="786" y="306" width="368" height="228" rx="14" fill="#F8FAFC"/>

  <!-- Bottom-left -->
  <rect x="30" y="570" width="400" height="200" rx="20" fill="#1E293B"/>
  <rect x="46" y="586" width="368" height="168" rx="14" fill="#F8FAFC"/>

  <!-- Bottom-right -->
  <rect x="770" y="570" width="400" height="200" rx="20" fill="#8B5CF6" opacity="0.7"/>
  <rect x="786" y="586" width="368" height="168" rx="14" fill="#F8FAFC"/>
</svg>
