<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg1)" rx="12"/>
  <!-- Blur orb -->
  <circle cx="200" cy="600" r="200" fill="#818CF8" opacity="0.3"/>
  <circle cx="1000" cy="200" r="150" fill="#A78BFA" opacity="0.2"/>
  <!-- Screen 1 — left, slight perspective -->
  <g transform="rotate(-3, 380, 400)">
    <rect x="60" y="100" width="640" height="440" rx="12" fill="#FFFFFF" opacity="0.95"/>
    <rect x="60" y="100" width="640" height="30" rx="12" fill="#F1F5F9"/>
    <circle cx="82" cy="115" r="5" fill="#E2E8F0"/>
    <circle cx="98" cy="115" r="5" fill="#E2E8F0"/>
    <circle cx="114" cy="115" r="5" fill="#E2E8F0"/>
    <rect x="60" y="130" width="640" height="410" fill="#F8FAFC"/>
  </g>
  <!-- Screen 2 — right, slight perspective opposite -->
  <g transform="rotate(3, 820, 400)">
    <rect x="500" y="180" width="640" height="440" rx="12" fill="#FFFFFF" opacity="0.95"/>
    <rect x="500" y="180" width="640" height="30" rx="12" fill="#F1F5F9"/>
    <circle cx="522" cy="195" r="5" fill="#E2E8F0"/>
    <circle cx="538" cy="195" r="5" fill="#E2E8F0"/>
    <circle cx="554" cy="195" r="5" fill="#E2E8F0"/>
    <rect x="500" y="210" width="640" height="410" fill="#F8FAFC"/>
  </g>
</svg>
