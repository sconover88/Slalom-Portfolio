<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <!-- Warm amber background -->
  <rect width="1200" height="800" fill="#FBBF24"/>
  <!-- Decorative -->
  <circle cx="100" cy="100" r="50" fill="#F59E0B" opacity="0.4"/>
  <circle cx="1100" cy="700" r="40" fill="#D97706" opacity="0.3"/>
  <path d="M50,600 Q80,580 110,600 T170,600" fill="none" stroke="#92400E" stroke-width="3" stroke-linecap="round" opacity="0.2"/>
  <!-- Left screen — fanned left -->
  <g transform="rotate(-15, 250, 600)">
    <rect x="52" y="102" width="500" height="700" rx="12" fill="rgba(0,0,0,0.2)"/>
    <rect x="40" y="90" width="500" height="700" rx="12" fill="#1E293B"/>
    <rect x="52" y="102" width="476" height="22" rx="5" fill="#334155"/>
    <circle cx="66" cy="113" r="3.5" fill="#EF4444"/>
    <circle cx="78" cy="113" r="3.5" fill="#FBBF24"/>
    <circle cx="90" cy="113" r="3.5" fill="#34D399"/>
    <rect x="52" y="128" width="476" height="650" rx="3" fill="#F1F5F9"/>
  </g>
  <!-- Center screen — straight -->
  <g>
    <rect x="362" y="62" width="500" height="700" rx="12" fill="rgba(0,0,0,0.2)"/>
    <rect x="350" y="50" width="500" height="700" rx="12" fill="#1E293B"/>
    <rect x="362" y="62" width="476" height="22" rx="5" fill="#334155"/>
    <circle cx="376" cy="73" r="3.5" fill="#EF4444"/>
    <circle cx="388" cy="73" r="3.5" fill="#FBBF24"/>
    <circle cx="400" cy="73" r="3.5" fill="#34D399"/>
    <rect x="362" y="88" width="476" height="650" rx="3" fill="#F1F5F9"/>
  </g>
  <!-- Right screen — fanned right -->
  <g transform="rotate(15, 950, 600)">
    <rect x="662" y="102" width="500" height="700" rx="12" fill="rgba(0,0,0,0.2)"/>
    <rect x="650" y="90" width="500" height="700" rx="12" fill="#1E293B"/>
    <rect x="662" y="102" width="476" height="22" rx="5" fill="#334155"/>
    <circle cx="676" cy="113" r="3.5" fill="#EF4444"/>
    <circle cx="688" cy="113" r="3.5" fill="#FBBF24"/>
    <circle cx="700" cy="113" r="3.5" fill="#34D399"/>
    <rect x="662" y="128" width="476" height="650" rx="3" fill="#F1F5F9"/>
  </g>
</svg>
