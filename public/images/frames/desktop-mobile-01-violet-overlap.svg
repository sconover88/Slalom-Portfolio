    <circle cx="88" cy="79" r="5" fill="#FBBF24"/>
    <circle cx="104" cy="79" r="5" fill="#34D399"/>
    <rect x="126" y="71" width="300" height="14" rx="7" fill="#475569"/>
    <rect x="53" y="99" width="794" height="499" rx="4" fill="#F1F5F9"/>
  </g>
  <!-- Phone — overlapping right, tilted opposite -->
  <g transform="rotate(10, 1020, 460)">
    <rect x="932" y="262" width="190" height="400" rx="26" fill="rgba(0,0,0,0.3)"/>
