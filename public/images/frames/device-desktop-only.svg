<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <!-- Background -->
  <rect width="1200" height="800" fill="#FFFDF5"/>

  <!-- Laptop/Browser frame — centered -->
  <g>
    <!-- Browser chrome -->
    <rect x="150" y="100" width="900" height="600" rx="16" fill="#1E293B"/>
    <!-- Top bar -->
    <rect x="162" y="112" width="876" height="36" rx="8" fill="#334155"/>
    <!-- Traffic lights -->
    <circle cx="182" cy="130" r="6" fill="#EF4444"/>
    <circle cx="200" cy="130" r="6" fill="#FBBF24"/>
    <circle cx="218" cy="130" r="6" fill="#34D399"/>
    <!-- URL bar -->
    <rect x="240" y="121" width="400" height="18" rx="9" fill="#475569"/>
    <!-- Screen area -->
    <rect x="162" y="152" width="876" height="536" rx="4" fill="#E2E8F0"/>
    <text x="600" y="430" text-anchor="middle" font-family="system-ui" font-size="16" fill="#94A3B8">DESKTOP SCREEN — 876×536</text>
  </g>
</svg>
