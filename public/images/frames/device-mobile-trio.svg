<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <!-- Background -->
  <rect width="1200" height="800" fill="#FFFDF5"/>

  <!-- Phone 1 — left, slight tilt -->
  <g transform="rotate(-4, 280, 400)">
    <rect x="180" y="120" width="200" height="420" rx="24" fill="#1E293B"/>
    <rect x="190" y="136" width="180" height="388" rx="16" fill="#E2E8F0"/>
    <text x="280" y="340" text-anchor="middle" font-family="system-ui" font-size="11" fill="#94A3B8">PHONE 1</text>
    <text x="280" y="356" text-anchor="middle" font-family="system-ui" font-size="10" fill="#94A3B8">180×388</text>
  </g>

  <!-- Phone 2 — center, straight -->
  <g>
    <rect x="500" y="100" width="200" height="420" rx="24" fill="#1E293B"/>
    <rect x="510" y="116" width="180" height="388" rx="16" fill="#E2E8F0"/>
    <text x="600" y="320" text-anchor="middle" font-family="system-ui" font-size="11" fill="#94A3B8">PHONE 2</text>
    <text x="600" y="336" text-anchor="middle" font-family="system-ui" font-size="10" fill="#94A3B8">180×388</text>
  </g>

  <!-- Phone 3 — right, slight tilt -->
  <g transform="rotate(4, 920, 400)">
    <rect x="820" y="120" width="200" height="420" rx="24" fill="#1E293B"/>
    <rect x="830" y="136" width="180" height="388" rx="16" fill="#E2E8F0"/>
    <text x="920" y="340" text-anchor="middle" font-family="system-ui" font-size="11" fill="#94A3B8">PHONE 3</text>
    <text x="920" y="356" text-anchor="middle" font-family="system-ui" font-size="10" fill="#94A3B8">180×388</text>
  </g>
</svg>
