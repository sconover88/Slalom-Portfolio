<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <!-- Background -->
  <rect width="1200" height="800" fill="#FFFDF5"/>

  <!-- Tablet 1 — large, slightly rotated -->
  <g transform="rotate(-5, 700, 300)">
    <rect x="480" y="80" width="520" height="380" rx="20" fill="#1E293B"/>
    <rect x="492" y="92" width="496" height="356" rx="12" fill="#E2E8F0"/>
    <text x="740" y="280" text-anchor="middle" font-family="system-ui" font-size="14" fill="#94A3B8">TABLET SCREEN 1 — 496×356</text>
  </g>

  <!-- Tablet 2 — smaller, rotated opposite -->
  <g transform="rotate(8, 900, 550)">
    <rect x="700" y="400" width="440" height="320" rx="18" fill="#1E293B"/>
    <rect x="711" y="411" width="418" height="298" rx="10" fill="#E2E8F0"/>
    <text x="920" y="565" text-anchor="middle" font-family="system-ui" font-size="13" fill="#94A3B8">TABLET SCREEN 2 — 418×298</text>
  </g>

  <!-- Phone — tall, slight angle -->
  <g transform="rotate(3, 1050, 400)">
    <rect x="1000" y="200" width="160" height="320" rx="20" fill="#1E293B"/>
    <rect x="1008" y="212" width="144" height="296" rx="12" fill="#E2E8F0"/>
    <text x="1080" y="365" text-anchor="middle" font-family="system-ui" font-size="10" fill="#94A3B8">PHONE — 144×296</text>
  </g>
</svg>
