<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <!-- Dark outer frame -->
  <rect width="1200" height="800" fill="#1E293B" rx="20"/>
  <!-- Gray inner border -->
  <rect x="40" y="40" width="1120" height="720" fill="#CBD5E1" rx="16"/>
  
  <!-- Top peeking screen (clipped) -->
  <rect x="80" y="50" width="1040" height="80" fill="#FFFFFF" rx="14"/>
  
  <!-- Main large screen -->
  <rect x="80" y="150" width="1040" height="500" fill="#FFFFFF" rx="16"/>
  
  <!-- Bottom peeking screen (clipped) -->
  <rect x="80" y="670" width="1040" height="80" fill="#FFFFFF" rx="14"/>
</svg>
