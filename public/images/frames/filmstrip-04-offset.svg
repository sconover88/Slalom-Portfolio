  <!-- Gray inner border -->
  <rect x="40" y="40" width="1120" height="720" fill="#CBD5E1" rx="16"/>
  
  <!-- Left column — shifted up -->
  <rect x="65" y="30" width="340" height="70" fill="#FFFFFF" rx="10"/>
  <rect x="65" y="115" width="340" height="480" fill="#FFFFFF" rx="14"/>
