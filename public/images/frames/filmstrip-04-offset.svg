  <rect x="420" y="165" width="340" height="480" fill="#FFFFFF" rx="14"/>
  <rect x="420" y="660" width="340" height="70" fill="#FFFFFF" rx="10"/>
  
  <!-- Right column — shifted up more -->
  <rect x="775" y="10" width="340" height="70" fill="#FFFFFF" rx="10"/>
  <rect x="775" y="95" width="340" height="480" fill="#FFFFFF" rx="14"/>
  <rect x="775" y="590" width="340" height="70" fill="#FFFFFF" rx="10"/>
