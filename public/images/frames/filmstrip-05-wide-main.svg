<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <!-- Dark outer frame -->
  <rect width="1200" height="800" fill="#1E293B" rx="20"/>
  <!-- Gray inner border -->
  <rect x="40" y="40" width="1120" height="720" fill="#CBD5E1" rx="16"/>
  
  <!-- Top peeking row -->
  <rect x="70" y="55" width="520" height="60" fill="#FFFFFF" rx="10"/>
  <rect x="610" y="55" width="520" height="60" fill="#FFFFFF" rx="10"/>
  
  <!-- Main large screen — full width -->
  <rect x="70" y="135" width="1060" height="460" fill="#FFFFFF" rx="16"/>
  
  <!-- Bottom peeking row -->
  <rect x="70" y="615" width="340" height="60" fill="#FFFFFF" rx="10"/>
  <rect x="430" y="615" width="340" height="60" fill="#FFFFFF" rx="10"/>
  <rect x="790" y="615" width="340" height="60" fill="#FFFFFF" rx="10"/>
</svg>
