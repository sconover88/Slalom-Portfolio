<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <!-- Background -->
  <rect width="1200" height="400" fill="#FFFDF5" rx="16"/>
  
  <!-- Decorative -->
  <circle cx="60" cy="50" r="25" fill="#8B5CF6" opacity="0.08"/>
  <circle cx="1140" cy="350" r="20" fill="#34D399" opacity="0.08"/>
  <polygon points="1100,40 1125,80 1075,80" fill="#FBBF24" opacity="0.1"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-family="Outfit, system-ui, sans-serif" font-size="16" font-weight="800" fill="#1E293B">Proposal Creation Flow</text>
  <text x="600" y="58" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui" font-size="10" fill="#64748B">Step-by-step guided experience replacing 6 legacy tools</text>

  <!-- Step 1: Proposal Setup -->
  <rect x="40" y="85" width="340" height="280" fill="#FFFFFF" rx="16" stroke="#1E293B" stroke-width="2"/>
  <!-- Step number -->
  <circle cx="75" cy="115" r="16" fill="#8B5CF6"/>
  <text x="75" y="120" text-anchor="middle" font-family="Outfit, system-ui" font-size="12" font-weight="700" fill="white">1</text>
  <text x="100" y="112" font-family="Outfit, system-ui" font-size="14" font-weight="700" fill="#1E293B">Proposal Setup</text>
  <text x="100" y="128" font-family="Plus Jakarta Sans, system-ui" font-size="10" fill="#64748B">Capture advertising goals</text>
  <!-- Mini UI elements -->
  <rect x="60" y="145" width="300" height="30" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="75" y="164" font-family="Plus Jakarta Sans, system-ui" font-size="9" fill="#94A3B8">Ad Type</text>
  <rect x="200" y="152" width="60" height="16" rx="4" fill="#8B5CF6" opacity="0.2"/>
  <rect x="265" y="152" width="50" height="16" rx="4" fill="#E2E8F0"/>

  <rect x="60" y="183" width="300" height="30" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="75" y="202" font-family="Plus Jakarta Sans, system-ui" font-size="9" fill="#94A3B8">Target Audience</text>
  <rect x="200" y="190" width="80" height="16" rx="4" fill="#34D399" opacity="0.2"/>

  <rect x="60" y="221" width="300" height="30" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="75" y="240" font-family="Plus Jakarta Sans, system-ui" font-size="9" fill="#94A3B8">Geography</text>
  <rect x="200" y="228" width="70" height="16" rx="4" fill="#FBBF24" opacity="0.2"/>

  <rect x="60" y="259" width="300" height="30" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="75" y="278" font-family="Plus Jakarta Sans, system-ui" font-size="9" fill="#94A3B8">Budget &amp; Dates</text>
  <rect x="200" y="266" width="90" height="16" rx="4" fill="#F472B6" opacity="0.2"/>

  <rect x="60" y="297" width="300" height="30" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="75" y="316" font-family="Plus Jakarta Sans, system-ui" font-size="9" fill="#94A3B8">Event Targeting</text>
  <rect x="200" y="304" width="55" height="16" rx="4" fill="#8B5CF6" opacity="0.2"/>

  <!-- Pill labels -->
  <rect x="60" y="340" width="130" height="18" rx="9" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1"/>
  <text x="125" y="352" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui" font-size="8" fill="#8B5CF6">All in one place</text>

  <!-- Arrow 1→2 -->
  <path d="M390,225 L420,225" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="420,220 435,225 420,230" fill="#1E293B"/>

  <!-- Step 2: Review -->
  <rect x="445" y="85" width="280" height="280" fill="#FFFFFF" rx="16" stroke="#1E293B" stroke-width="2"/>
  <circle cx="480" cy="115" r="16" fill="#34D399"/>
  <text x="480" y="120" text-anchor="middle" font-family="Outfit, system-ui" font-size="12" font-weight="700" fill="white">2</text>
  <text x="505" y="112" font-family="Outfit, system-ui" font-size="14" font-weight="700" fill="#1E293B">Review</text>
  <text x="505" y="128" font-family="Plus Jakarta Sans, system-ui" font-size="10" fill="#64748B">Comprehensive summary</text>
  <!-- Summary card UI -->
  <rect x="465" y="145" width="240" height="200" rx="10" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="480" y="160" width="120" height="8" rx="4" fill="#1E293B" opacity="0.6"/>
  <rect x="480" y="176" width="200" height="6" rx="3" fill="#E2E8F0"/>
  <rect x="480" y="188" width="180" height="6" rx="3" fill="#E2E8F0"/>
  <rect x="480" y="200" width="190" height="6" rx="3" fill="#E2E8F0"/>
  <line x1="480" y1="216" x2="690" y2="216" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="480" y="226" width="100" height="8" rx="4" fill="#1E293B" opacity="0.6"/>
  <rect x="480" y="242" width="200" height="6" rx="3" fill="#E2E8F0"/>
  <rect x="480" y="254" width="160" height="6" rx="3" fill="#E2E8F0"/>
  <line x1="480" y1="270" x2="690" y2="270" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="480" y="280" width="80" height="8" rx="4" fill="#1E293B" opacity="0.6"/>
  <rect x="480" y="296" width="200" height="6" rx="3" fill="#E2E8F0"/>
  <rect x="480" y="308" width="140" height="6" rx="3" fill="#E2E8F0"/>
  <!-- Checkmark -->
  <circle cx="690" cy="330" r="12" fill="#34D399"/>
  <path d="M684,330 L688,334 L696,326" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Arrow 2→3 -->
  <path d="M735,225 L765,225" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="765,220 780,225 765,230" fill="#1E293B"/>

  <!-- Step 3: Proposal Output -->
  <rect x="790" y="85" width="370" height="280" fill="#FFFFFF" rx="16" stroke="#1E293B" stroke-width="2"/>
  <circle cx="825" cy="115" r="16" fill="#FBBF24"/>
  <text x="825" y="120" text-anchor="middle" font-family="Outfit, system-ui" font-size="12" font-weight="700" fill="#1E293B">3</text>
  <text x="850" y="112" font-family="Outfit, system-ui" font-size="14" font-weight="700" fill="#1E293B">Proposal Output</text>
  <text x="850" y="128" font-family="Plus Jakarta Sans, system-ui" font-size="10" fill="#64748B">Ready for delivery</text>
  <!-- Document UI -->
  <rect x="810" y="145" width="330" height="200" rx="10" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="825" y="158" width="180" height="10" rx="5" fill="#1E293B"/>
  <rect x="825" y="178" width="300" height="6" rx="3" fill="#E2E8F0"/>
  <rect x="825" y="190" width="280" height="6" rx="3" fill="#E2E8F0"/>
  <rect x="825" y="202" width="260" height="6" rx="3" fill="#E2E8F0"/>
  <line x1="825" y1="218" x2="1125" y2="218" stroke="#E2E8F0" stroke-width="1"/>
  <!-- Chart placeholder -->
  <rect x="825" y="228" width="140" height="80" rx="6" fill="#F5F3FF"/>
  <rect x="835" y="280" width="20" height="20" rx="2" fill="#8B5CF6" opacity="0.6"/>
  <rect x="860" y="265" width="20" height="35" rx="2" fill="#8B5CF6" opacity="0.4"/>
  <rect x="885" y="250" width="20" height="50" rx="2" fill="#8B5CF6" opacity="0.8"/>
  <rect x="910" y="260" width="20" height="40" rx="2" fill="#8B5CF6" opacity="0.5"/>
  <!-- Table placeholder -->
  <rect x="980" y="228" width="140" height="80" rx="6" fill="#ECFDF5"/>
  <rect x="990" y="240" width="120" height="8" rx="2" fill="#34D399" opacity="0.3"/>
  <rect x="990" y="254" width="120" height="8" rx="2" fill="#34D399" opacity="0.2"/>
  <rect x="990" y="268" width="120" height="8" rx="2" fill="#34D399" opacity="0.3"/>
  <rect x="990" y="282" width="120" height="8" rx="2" fill="#34D399" opacity="0.2"/>

  <!-- Send button -->
  <rect x="980" y="330" width="140" height="28" rx="14" fill="#8B5CF6"/>
  <text x="1050" y="348" text-anchor="middle" font-family="Outfit, system-ui" font-size="10" font-weight="700" fill="white">Send to Client</text>

  <!-- Bottom label -->
  <text x="600" y="390" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui" font-size="10" fill="#64748B">Launched to pilot group of 15 users &#x2022; 3-month diary study conducted</text>
</svg>
