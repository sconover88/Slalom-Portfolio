  <rect x="55" y="278" width="40" height="35" fill="#FEE2E2" rx="6" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="105" y="278" width="40" height="35" fill="#FEF3C7" rx="6" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="155" y="278" width="40" height="35" fill="#DBEAFE" rx="6" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="55" y="322" width="40" height="35" fill="#E0E7FF" rx="6" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="105" y="322" width="40" height="35" fill="#D1FAE5" rx="6" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="155" y="322" width="40" height="35" fill="#FCE7F3" rx="6" stroke="#1E293B" stroke-width="1.5"/>
  
  <!-- X marks on old apps -->
  <text x="75" y="300" text-anchor="middle" font-family="system-ui" font-size="14" fill="#EF4444">✕</text>
  <text x="125" y="300" text-anchor="middle" font-family="system-ui" font-size="14" fill="#EF4444">✕</text>
  <text x="175" y="300" text-anchor="middle" font-family="system-ui" font-size="14" fill="#EF4444">✕</text>
  <text x="75" y="344" text-anchor="middle" font-family="system-ui" font-size="14" fill="#EF4444">✕</text>
  <text x="125" y="344" text-anchor="middle" font-family="system-ui" font-size="14" fill="#EF4444">✕</text>
  <text x="175" y="344" text-anchor="middle" font-family="system-ui" font-size="14" fill="#EF4444">✕</text>

  <!-- Arrow -->
  <path d="M220,310 L320,310" fill="none" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>
  <polygon points="320,304 335,310 320,316" fill="#1E293B"/>
  
  <!-- Single unified platform (after) -->
  <text x="520" y="268" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748B">AFTER</text>
  <rect x="360" y="278" width="320" height="80" fill="#F5F3FF" rx="12" stroke="#8B5CF6" stroke-width="2.5"/>
  <circle cx="400" cy="318" r="16" fill="#8B5CF6"/>
  <path d="M394,318 L400,312 L406,318 M400,312 L400,324" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <text x="430" y="312" font-family="Outfit, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1E293B">Proposal Management Platform</text>
  <text x="430" y="332" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="12" fill="#64748B">One unified, AI-powered experience</text>


  <!-- Bottom row: qualitative wins -->
  <rect x="40" y="395" width="230" height="85" fill="#FFFFFF" rx="16" stroke="#1E293B" stroke-width="2"/>
  <rect x="46" y="401" width="230" height="85" fill="#8B5CF6" rx="16" opacity="0.08"/>
  <rect x="40" y="395" width="230" height="85" fill="#FFFFFF" rx="16" stroke="#1E293B" stroke-width="2"/>
  <circle cx="70" cy="425" r="14" fill="#8B5CF6"/>
  <path d="M64,425 L68,429 L76,421" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="92" y="422" font-family="Outfit, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1E293B">Stakeholder</text>
  <text x="92" y="440" font-family="Outfit, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1E293B">Recognition</text>
  <text x="60" y="465" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" fill="#64748B">Simplicity called out as key success</text>

  <rect x="285" y="395" width="230" height="85" fill="#FFFFFF" rx="16" stroke="#1E293B" stroke-width="2"/>
  <rect x="291" y="401" width="230" height="85" fill="#F472B6" rx="16" opacity="0.08"/>
  <rect x="285" y="395" width="230" height="85" fill="#FFFFFF" rx="16" stroke="#1E293B" stroke-width="2"/>
  <circle cx="315" cy="425" r="14" fill="#F472B6"/>
  <path d="M309,425 L313,429 L321,421" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="337" y="422" font-family="Outfit, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1E293B">Sales Rep</text>
  <text x="337" y="440" font-family="Outfit, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1E293B">Buy-In</text>
  <text x="305" y="465" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" fill="#64748B">Achieved before launch via co-design</text>

  <rect x="530" y="395" width="230" height="85" fill="#FFFFFF" rx="16" stroke="#1E293B" stroke-width="2"/>
  <rect x="536" y="401" width="230" height="85" fill="#34D399" rx="16" opacity="0.08"/>
  <rect x="530" y="395" width="230" height="85" fill="#FFFFFF" rx="16" stroke="#1E293B" stroke-width="2"/>
  <circle cx="560" cy="425" r="14" fill="#34D399"/>
  <path d="M554,425 L558,429 L566,421" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="582" y="422" font-family="Outfit, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1E293B">Standardized</text>
  <text x="582" y="440" font-family="Outfit, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1E293B">Proposals</text>
  <text x="550" y="465" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" fill="#64748B">Consistent across all teams &amp; regions</text>
</svg>
