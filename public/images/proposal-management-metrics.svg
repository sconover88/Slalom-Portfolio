  <rect x="546" y="96" width="220" height="120" fill="#FBBF24" rx="16" opacity="0.15"/>
  <rect x="540" y="90" width="220" height="120" fill="#FFFFFF" rx="16" stroke="#1E293B" stroke-width="2"/>
  <!-- Icon circle -->
