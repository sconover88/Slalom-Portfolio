  <text x="360" y="128" font-family="Outfit, system-ui, sans-serif" font-size="28" font-weight="800" fill="#F472B6">20,000+</text>
  <text x="360" y="150" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="13" font-weight="500" fill="#64748B">Proposals Created</text>
  <text x="310" y="185" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="11" fill="#64748B">In the platform's first year</text>

