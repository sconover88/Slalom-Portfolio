<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- Background -->
  <rect width="800" height="500" fill="#FFFDF5" rx="16"/>
  
  <!-- Decorative shapes -->
  <circle cx="60" cy="60" r="30" fill="#FBBF24" opacity="0.3"/>
  <polygon points="750,40 770,80 730,80" fill="#F472B6" opacity="0.3"/>
  <circle cx="740" cy="440" r="20" fill="#34D399" opacity="0.3"/>
  <rect x="30" y="420" width="25" height="25" fill="#8B5CF6" opacity="0.2" transform="rotate(45 42.5 432.5)"/>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" font-family="Outfit, system-ui, sans-serif" font-size="22" font-weight="800" fill="#1E293B">Impact &amp; Results</text>
  
  <!-- Squiggly line under title -->
  <path d="M280,62 Q310,52 340,62 T400,62 T460,62 T520,62" fill="none" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round"/>

