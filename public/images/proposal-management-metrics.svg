  <rect x="40" y="90" width="220" height="120" fill="#FFFFFF" rx="16" stroke="#1E293B" stroke-width="2"/>
  <rect x="44" y="94" width="220" height="120" fill="none" rx="16" stroke="#8B5CF6" stroke-width="0"/>
  <!-- Hard shadow -->
  <rect x="46" y="96" width="220" height="120" fill="#8B5CF6" rx="16" opacity="0.15"/>
  <rect x="40" y="90" width="220" height="120" fill="#FFFFFF" rx="16" stroke="#1E293B" stroke-width="2"/>
  <!-- Icon circle -->
  <circle cx="80" cy="130" r="20" fill="#8B5CF6"/>
  <path d="M72,130 L80,122 L88,130 M80,122 L80,138" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Text -->
  <text x="110" y="128" font-family="Outfit, system-ui, sans-serif" font-size="28" font-weight="800" fill="#8B5CF6">10,000+</text>
  <text x="110" y="150" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="13" font-weight="500" fill="#64748B">Users Onboarded</text>
  <!-- Sub text -->
  <text x="60" y="185" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="11" fill="#64748B">Expanding to 50,000 users</text>

  <!-- Stat Card 2: 20,000+ Proposals -->
  <rect x="290" y="90" width="220" height="120" fill="#FFFFFF" rx="16" stroke="#1E293B" stroke-width="2"/>
  <rect x="296" y="96" width="220" height="120" fill="#F472B6" rx="16" opacity="0.15"/>
  <rect x="290" y="90" width="220" height="120" fill="#FFFFFF" rx="16" stroke="#1E293B" stroke-width="2"/>
  <!-- Icon circle -->
  <circle cx="330" cy="130" r="20" fill="#F472B6"/>
  <rect x="321" y="122" width="18" height="16" fill="none" stroke="white" stroke-width="2.5" rx="2" stroke-linecap="round"/>
  <path d="M326,130 L330,134 L338,126" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
