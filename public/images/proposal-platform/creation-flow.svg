<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480">
  <!-- Background -->
  <rect width="1200" height="480" fill="#F8FAFC" rx="12"/>
  <!-- Subtle decorative gradient fill -->
  <rect x="0" y="0" width="1200" height="480" fill="#4F46E5" opacity="0.015" rx="12"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0F172A">Proposal Creation Flow</text>
  <text x="600" y="58" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="11" fill="#64748B">Step-by-step guided experience replacing 6 legacy tools</text>

  <!-- Step 1: Proposal Setup -->
  <rect x="40" y="80" width="340" height="340" fill="#FFFFFF" rx="12" stroke="#E2E8F0" stroke-width="1"/>
  <!-- Step number + title -->
  <circle cx="80" cy="115" r="20" fill="#EEF2FF"/>
  <text x="80" y="115" text-anchor="middle" dominant-baseline="central" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#4F46E5">1</text>
  <text x="108" y="110" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Proposal Setup</text>
  <text x="108" y="126" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#64748B">Capture advertising goals in one place</text>

  <!-- Form fields -->
  <rect x="60" y="148" width="300" height="30" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="75" y="167" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#94A3B8">Ad Type</text>
  <rect x="200" y="155" width="60" height="16" rx="4" fill="#4F46E5" opacity="0.2"/>
  <rect x="268" y="155" width="50" height="16" rx="4" fill="#E2E8F0"/>

  <rect x="60" y="186" width="300" height="30" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="75" y="205" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#94A3B8">Target Audience</text>
  <rect x="200" y="193" width="80" height="16" rx="4" fill="#10B981" opacity="0.2"/>

  <rect x="60" y="224" width="300" height="30" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="75" y="243" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#94A3B8">Geography</text>
  <rect x="200" y="231" width="70" height="16" rx="4" fill="#7C3AED" opacity="0.2"/>

  <rect x="60" y="262" width="300" height="30" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="75" y="281" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#94A3B8">Budget &amp; Dates</text>
  <rect x="200" y="269" width="90" height="16" rx="4" fill="#4F46E5" opacity="0.2"/>

  <rect x="60" y="300" width="300" height="30" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="75" y="319" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#94A3B8">Event Targeting</text>
  <rect x="200" y="307" width="55" height="16" rx="4" fill="#4F46E5" opacity="0.2"/>

  <!-- Pill label -->
  <rect x="60" y="345" width="140" height="22" rx="11" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
  <text x="130" y="360" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" font-weight="600" fill="#4F46E5">All in one place</text>

  <!-- Arrow 1&#x2192;2 -->
  <path d="M390,250 L420,250" fill="none" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="420,245 435,250 420,255" fill="#0F172A"/>

  <!-- Step 2: Review -->
  <rect x="445" y="80" width="300" height="340" fill="#FFFFFF" rx="12" stroke="#E2E8F0" stroke-width="1"/>
  <circle cx="485" cy="115" r="20" fill="#ECFDF5"/>
  <text x="485" y="115" text-anchor="middle" dominant-baseline="central" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#10B981">2</text>
  <text x="513" y="110" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Review</text>
  <text x="513" y="126" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#64748B">Comprehensive summary before submission</text>

  <!-- Summary card UI -->
  <rect x="465" y="148" width="260" height="235" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="480" y="165" width="120" height="8" rx="4" fill="#0F172A" opacity="0.6"/>
  <rect x="480" y="181" width="220" height="6" rx="3" fill="#E2E8F0"/>
  <rect x="480" y="193" width="200" height="6" rx="3" fill="#E2E8F0"/>
  <rect x="480" y="205" width="210" height="6" rx="3" fill="#E2E8F0"/>
  <line x1="480" y1="221" x2="710" y2="221" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="480" y="231" width="100" height="8" rx="4" fill="#0F172A" opacity="0.6"/>
  <rect x="480" y="247" width="220" height="6" rx="3" fill="#E2E8F0"/>
  <rect x="480" y="259" width="180" height="6" rx="3" fill="#E2E8F0"/>
  <line x1="480" y1="275" x2="710" y2="275" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="480" y="285" width="80" height="8" rx="4" fill="#0F172A" opacity="0.6"/>
  <rect x="480" y="301" width="220" height="6" rx="3" fill="#E2E8F0"/>
  <rect x="480" y="313" width="160" height="6" rx="3" fill="#E2E8F0"/>
  <line x1="480" y1="329" x2="710" y2="329" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="480" y="339" width="90" height="8" rx="4" fill="#0F172A" opacity="0.6"/>
  <rect x="480" y="355" width="200" height="6" rx="3" fill="#E2E8F0"/>
  <rect x="480" y="367" width="140" height="6" rx="3" fill="#E2E8F0"/>

  <!-- Checkmark -->
  <circle cx="710" cy="395" r="14" fill="#10B981"/>
  <path d="M704,395 L708,399 L716,391" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Arrow 2&#x2192;3 -->
  <path d="M755,250 L785,250" fill="none" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="785,245 800,250 785,255" fill="#0F172A"/>

  <!-- Step 3: Proposal Output -->
  <rect x="810" y="80" width="350" height="340" fill="#FFFFFF" rx="12" stroke="#E2E8F0" stroke-width="1"/>
  <circle cx="850" cy="115" r="20" fill="#EEF2FF"/>
  <text x="850" y="115" text-anchor="middle" dominant-baseline="central" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#7C3AED">3</text>
  <text x="878" y="110" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Proposal Output</text>
  <text x="878" y="126" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#64748B">Ready for client delivery</text>

  <!-- Document UI -->
  <rect x="830" y="148" width="310" height="210" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="845" y="163" width="180" height="10" rx="5" fill="#0F172A"/>
  <rect x="845" y="183" width="280" height="6" rx="3" fill="#E2E8F0"/>
  <rect x="845" y="195" width="260" height="6" rx="3" fill="#E2E8F0"/>
  <rect x="845" y="207" width="240" height="6" rx="3" fill="#E2E8F0"/>
  <line x1="845" y1="223" x2="1125" y2="223" stroke="#E2E8F0" stroke-width="1"/>
  <!-- Chart placeholder -->
  <rect x="845" y="233" width="130" height="80" rx="8" fill="#EEF2FF"/>
  <rect x="855" y="285" width="20" height="20" rx="2" fill="#4F46E5" opacity="0.6"/>
  <rect x="880" y="270" width="20" height="35" rx="2" fill="#4F46E5" opacity="0.4"/>
  <rect x="905" y="255" width="20" height="50" rx="2" fill="#4F46E5" opacity="0.8"/>
  <rect x="930" y="265" width="20" height="40" rx="2" fill="#4F46E5" opacity="0.5"/>
  <!-- Table placeholder -->
  <rect x="990" y="233" width="130" height="80" rx="8" fill="#ECFDF5"/>
  <rect x="1000" y="245" width="110" height="8" rx="2" fill="#10B981" opacity="0.3"/>
  <rect x="1000" y="259" width="110" height="8" rx="2" fill="#10B981" opacity="0.2"/>
  <rect x="1000" y="273" width="110" height="8" rx="2" fill="#10B981" opacity="0.3"/>
  <rect x="1000" y="287" width="110" height="8" rx="2" fill="#10B981" opacity="0.2"/>

  <!-- Send button -->
  <rect x="990" y="375" width="150" height="30" rx="8" fill="#4F46E5"/>
  <text x="1065" y="394" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="11" font-weight="700" fill="white">Send to Client</text>

  <!-- Bottom summary bar -->
  <rect x="40" y="440" width="1120" height="28" rx="14" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
  <text x="600" y="458" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="11" font-weight="600" fill="#4F46E5">Launched to pilot group of 15 users &#x2022; 3-month diary study conducted</text>
</svg>
