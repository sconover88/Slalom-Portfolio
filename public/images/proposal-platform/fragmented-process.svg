<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <!-- Background -->
  <rect width="1200" height="520" fill="#F8FAFC" rx="12"/>
  <!-- Subtle decorative gradient fill -->
  <rect x="0" y="0" width="1200" height="520" fill="#4F46E5" opacity="0.015" rx="12"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0F172A">The Fragmented Process</text>
  <text x="600" y="58" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="11" fill="#64748B">6 disconnected tools required to build a single advertising proposal</text>

  <!-- Row 1: 3 App Cards -->
  <!-- App Card 1 -->
  <rect x="40" y="80" width="360" height="160" fill="#FFFFFF" rx="12" stroke="#E2E8F0" stroke-width="1"/>
  <circle cx="80" cy="120" r="20" fill="#EEF2FF"/>
  <rect x="72" y="112" width="16" height="16" fill="none" stroke="#7C3AED" stroke-width="2.5" rx="2"/>
  <text x="108" y="116" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Planning &#x2022; Proposal</text>
  <text x="108" y="132" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#64748B">Campaign setup and proposal drafting</text>
  <!-- Mini UI elements -->
  <rect x="60" y="150" width="320" height="8" rx="4" fill="#E2E8F0"/>
  <rect x="60" y="164" width="260" height="8" rx="4" fill="#E2E8F0"/>
  <circle cx="80" cy="200" r="12" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <circle cx="110" cy="200" r="12" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <circle cx="140" cy="200" r="12" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="170" y="192" width="80" height="16" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="260" y="192" width="60" height="16" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>

  <!-- App Card 2 -->
  <rect x="420" y="80" width="360" height="160" fill="#FFFFFF" rx="12" stroke="#E2E8F0" stroke-width="1"/>
  <circle cx="460" cy="120" r="20" fill="#EEF2FF"/>
  <path d="M453,120 L460,113 L467,120 M460,113 L460,127" fill="none" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round"/>
  <text x="488" y="116" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Pricing &#x2022; Rates</text>
  <text x="488" y="132" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#64748B">Rate cards and pricing configuration</text>
  <!-- Table rows -->
  <rect x="440" y="150" width="320" height="20" rx="4" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="440" y="176" width="320" height="20" rx="4" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="440" y="202" width="320" height="20" rx="4" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>

  <!-- App Card 3 -->
  <rect x="800" y="80" width="360" height="160" fill="#FFFFFF" rx="12" stroke="#E2E8F0" stroke-width="1"/>
  <circle cx="840" cy="120" r="20" fill="#EEF2FF"/>
  <path d="M834,117 L840,123 L846,117" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
  <text x="868" y="116" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Inventory &#x2022; Availability</text>
  <text x="868" y="132" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#64748B">Ad slot availability and scheduling</text>
  <!-- Chart bars -->
  <rect x="820" y="185" width="30" height="40" rx="4" fill="#4F46E5" opacity="0.4"/>
  <rect x="858" y="170" width="30" height="55" rx="4" fill="#4F46E5" opacity="0.6"/>
  <rect x="896" y="180" width="30" height="45" rx="4" fill="#4F46E5" opacity="0.3"/>
  <rect x="934" y="162" width="30" height="63" rx="4" fill="#4F46E5" opacity="0.8"/>
  <rect x="972" y="175" width="30" height="50" rx="4" fill="#4F46E5" opacity="0.5"/>
  <rect x="1010" y="168" width="30" height="57" rx="4" fill="#4F46E5" opacity="0.4"/>

  <!-- Row 2: 3 App Cards -->
  <!-- App Card 4 -->
  <rect x="40" y="260" width="360" height="160" fill="#FFFFFF" rx="12" stroke="#E2E8F0" stroke-width="1"/>
  <circle cx="80" cy="300" r="20" fill="#EEF2FF"/>
  <rect x="72" y="292" width="16" height="16" fill="none" stroke="#F59E0B" stroke-width="2.5" rx="2"/>
  <text x="108" y="296" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Audience &#x2022; Targeting</text>
  <text x="108" y="312" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#64748B">Demographics and audience configuration</text>
  <!-- Form fields -->
  <rect x="60" y="330" width="320" height="24" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="60" y="362" width="320" height="24" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="60" y="394" width="150" height="16" rx="8" fill="#FEF3C7" stroke="#E2E8F0" stroke-width="1"/>

  <!-- App Card 5 -->
  <rect x="420" y="260" width="360" height="160" fill="#FFFFFF" rx="12" stroke="#E2E8F0" stroke-width="1"/>
  <circle cx="460" cy="300" r="20" fill="#EEF2FF"/>
  <path d="M454,297 L460,303 L466,297" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round"/>
  <text x="488" y="296" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Delivery &#x2022; Scheduling</text>
  <text x="488" y="312" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#64748B">Flight dates and delivery management</text>
  <!-- Content lines -->
  <rect x="440" y="330" width="320" height="8" rx="4" fill="#E2E8F0"/>
  <rect x="440" y="344" width="260" height="8" rx="4" fill="#E2E8F0"/>
  <rect x="440" y="358" width="280" height="8" rx="4" fill="#E2E8F0"/>
  <rect x="440" y="372" width="240" height="8" rx="4" fill="#E2E8F0"/>
  <!-- Buttons -->
  <rect x="440" y="394" width="100" height="20" rx="8" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
  <rect x="548" y="394" width="80" height="20" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>

  <!-- App Card 6 -->
  <rect x="800" y="260" width="360" height="160" fill="#FFFFFF" rx="12" stroke="#E2E8F0" stroke-width="1"/>
  <circle cx="840" cy="300" r="20" fill="#EEF2FF"/>
  <path d="M833,305 L840,298 L847,305 M833,296 L840,289 L847,296" fill="none" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="868" y="296" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Reporting &#x2022; Output</text>
  <text x="868" y="312" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#64748B">Performance reports and proposal output</text>
  <!-- Metrics mini cards -->
  <rect x="820" y="330" width="155" height="50" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="983" y="330" width="155" height="50" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <!-- Button -->
  <rect x="820" y="394" width="320" height="22" rx="8" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>

  <!-- Bottom summary bar -->
  <rect x="40" y="445" width="1120" height="55" fill="#FEF2F2" rx="12" stroke="#FECACA" stroke-width="1"/>
  <circle cx="80" cy="472" r="14" fill="#FEE2E2"/>
  <text x="80" y="472" text-anchor="middle" dominant-baseline="central" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="14" fill="#EF4444" font-weight="bold">!</text>
  <text x="102" y="468" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F172A">6 apps &#x2022; 0 integration &#x2022; Manual copy-paste between tools</text>
  <text x="102" y="486" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" fill="#64748B">Slow, inconsistent across teams and regions, no room for data-driven optimization</text>
</svg>
